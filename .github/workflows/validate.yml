name: validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Validate public structure and examples
        run: python scripts/validate_blueprint.py
      - name: Run tests
        run: python -m pytest tests -q
      - name: Run static type checks
        run: pyright tools scripts tests
      - name: Run Python security checks
        run: bandit -q -r tools scripts
      - name: Scan tracked files for secrets
        run: git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline
      - name: Audit declared dependencies
        run: |
          pip-audit -r requirements-dev.lock
          pip-audit -r tools/secure-credentials/requirements.lock
      - name: Run repository preflight
        run: python scripts/preflight.py --json --repository-only
      - name: Remove generated caches
        run: python -c "from pathlib import Path; import shutil; [shutil.rmtree(p) for n in ('__pycache__','.pytest_cache','.mypy_cache','.ruff_cache') for p in list(Path('.').rglob(n)) if p.is_dir()]"
      - name: Validate clean release surface
        run: python scripts/validate_blueprint.py --release
