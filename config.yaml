_config_version: 40
compression:
  enabled: true
  threshold: 0.85
  target_ratio: 0.5
  protect_last_n: 80
  protect_first_n: 5
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 12000
  user_char_limit: 6000
display:
  interim_assistant_messages: false
  show_commentary: false
  tool_progress: false
  busy_input_mode: steer
  busy_ack_enabled: true
gateway:
  delivery_ledger: true
  session_reset:
    mode: none
agent:
  bot_mode_protocol: true
updates:
  pre_update_backup: full
  backup_keep: 5
runtime:
  nofile_soft_limit: 4096
terminal:
  cwd: "."
  home_mode: auto
toolsets:
  - hermes-cli
  - kanban
kanban:
  dispatch_in_gateway: true
  auto_decompose: false
  auto_subscribe_on_create: false
